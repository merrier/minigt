name: Brand Scraper

on:
  # 定时分类同步由 MINI GT Scraper 在车型抓取完成后执行。
  workflow_dispatch:

concurrency:
  group: minigt-publish
  queue: max
  cancel-in-progress: false

jobs:
  scrape-brands:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout dev source
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Use dev branch
        run: git checkout -B dev origin/dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run brand scraper
        run: npm run scrape:brands

      - name: Check and build before publishing
        run: npm run check

      - name: Commit and push changes
        id: commit
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A data/product-brands.json data/brands
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No brand changes detected"
            exit 0
          fi
          git commit -m "Update brand information $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          # 若人工提交推进了 dev，让 push 失败；不能发布未经校验的 rebase 结果。
          git push origin dev
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to main
        if: steps.commit.outputs.changed == 'true'
        run: |
          rm -rf /tmp/minigt-dist /tmp/minigt-github
          cp -R dist /tmp/minigt-dist
          cp -R .github /tmp/minigt-github
          git fetch origin main
          git checkout -B main origin/main
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'README.md' ! -name '.gitignore' ! -name 'node_modules' -exec rm -rf {} +
          cp -R /tmp/minigt-github .github
          cp -R /tmp/minigt-dist/* .
          git add -A
          if git diff --cached --quiet; then
            echo "No deploy changes detected"
            exit 0
          fi
          git commit -m "Deploy to main $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push origin main
