name: Brand Scraper

on:
  schedule:
    # 19:00 Asia/Shanghai
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mini-gt-brand-scraper
  cancel-in-progress: false

jobs:
  scrape-brands:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run brand scraper
        run: npm run scrape:brands

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add product-brands.json brands/
          if git diff --cached --quiet; then
            echo "No brand changes detected"
            exit 0
          fi
          git commit -m "Update brand information $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
