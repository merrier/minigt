name: MINI GT Scraper

on:
  schedule:
    # 20:00 Asia/Shanghai
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      category_ids:
        description: "Comma-separated category IDs to scrape, for example 22"
        required: false
        default: ""
      max_products:
        description: "Limit product detail pages processed, useful for targeted repairs"
        required: false
        default: ""
      all_pages:
        description: "Set to 1 to scrape all pagination pages"
        required: false
        default: ""
      skip_scrape:
        description: "Set to 1 to only upload existing local images"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: mini-gt-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run scraper
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_scrape != '1' }}
        env:
          SCRAPE_CATEGORY_IDS: ${{ inputs.category_ids }}
          SCRAPE_MAX_PRODUCTS: ${{ inputs.max_products }}
          SCRAPE_ALL_PAGES: ${{ inputs.all_pages }}
        run: npm run scrape

      - name: Upload images to superbed
        env:
          SUPERBED_TOKEN: ${{ secrets.SUPERBED_TOKEN }}
        run: npm run upload-images

      - name: Verify remote image URLs
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const products = JSON.parse(fs.readFileSync('products.json', 'utf8'));
          const localImages = [];
          for (const product of products) {
            for (const image of product.images || []) {
              if (!/^https?:\/\//.test(image)) {
                localImages.push(`${product.sku}: ${image}`);
              }
            }
          }
          if (localImages.length > 0) {
            console.error(`Found ${localImages.length} local image references after upload:`);
            console.error(localImages.slice(0, 20).join('\n'));
            process.exit(1);
          }
          console.log('All product images use remote URLs');
          NODE
          rm -rf images

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add products.json
          if git diff --cached --quiet; then
            echo "No product changes detected"
            exit 0
          fi
          git commit -m "Update MINI GT data $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
